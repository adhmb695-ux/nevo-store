<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>NEVO STORE - تسجيل دخول الأدمن</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-box" style="max-width: 400px; margin: 100px auto; padding: 20px; text-align: center; border: 1px solid #333; border-radius: 8px;">
    <h2>لوحة التحكم الخاصة</h2>
    <input type="email" id="email" placeholder="البريد الإلكتروني" style="width: 100%; margin: 10px 0; padding: 10px;">
    <input type="password" id="password" placeholder="كلمة المرور" style="width: 100%; margin: 10px 0; padding: 10px;">
    <button onclick="login()" style="width: 100%; padding: 10px; cursor: pointer;">دخول</button>
  </div>
  <script>
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = '/admin';
      } else {
        alert(data.message);
      }
    }
  </script>
</body>
</html>
